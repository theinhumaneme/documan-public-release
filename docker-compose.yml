# Documan, whole.
#
#   cp .env.example .env      # fill it in; it is gitignored
#   docker compose up -d --build
#
# The browser only ever talks to `web`. It serves the built application and
# proxies /api to `api` on the internal network, so there is one origin, no CORS,
# and the API is not exposed to the outside world at all — note that `api`,
# `postgres`, `redis` and `meilisearch` publish no ports. Put a TLS terminator in
# front of `web` and that is the whole attack surface.
#
# Configuration comes from .env. Nothing here has a default for a credential: a
# missing password stops the stack at startup rather than starting something that
# half works. Non-secret settings do have defaults, because a deployment that
# does not care should not have to state them.

name: documan

services:
  postgres:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-documan}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.52
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health | grep -q available"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./documan-java21
      # The Maven profile is baked in at build time and decides which
      # application-<profile>.yml the jar carries. `production` is the one whose
      # every value comes from the environment.
      args:
        ENV: production
    image: ${IMAGE_REPO:-theinhumaneme/images}:${API_TAG:-documan-java-25-v1}
    environment:
      SPRING_PROFILES_ACTIVE: production

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-documan}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX_PREFIX: ${MEILI_INDEX_PREFIX:-documan_prod_}

      # Clerk. Public identifiers, not secrets — the secret key is never used by
      # this service, which verifies tokens against the published signing keys.
      CLERK_ISSUER_URI: ${CLERK_ISSUER_URI:?set CLERK_ISSUER_URI in .env}
      CLERK_JWK_SET_URI: ${CLERK_JWK_SET_URI:?set CLERK_JWK_SET_URI in .env}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}

      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
      R2_FILES_BUCKET: ${R2_FILES_BUCKET:?set R2_FILES_BUCKET in .env}
      R2_FILES_PUBLIC_URL: ${R2_FILES_PUBLIC_URL:?set R2_FILES_PUBLIC_URL in .env}

      DDL_AUTO: ${DDL_AUTO:-update}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./documan-angular-21
      # Compile-time, because a single-page application carries its configuration
      # in the bundle the browser downloads. One image per Clerk instance.
      args:
        # Without this the Dockerfile falls through to `ng build -c development`,
        # and it did: the deployed site was serving an unminified 237 KB main.js
        # under unhashed filenames. The `api` service above has always passed its
        # ENV; this one never did, and nothing failed loudly enough to notice.
        #
        # Hashing is the half that matters operationally. `outputHashing: all`
        # only applies to the production configuration, so a development build
        # emits a bare `styles.css` — which Cloudflare then caches for three days
        # under `max-age=259200`, making every style change invisible until it
        # expires. A hashed name is a new URL, so a deploy is picked up at once.
        ENV: production
        CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY in .env}
        CLERK_JWT_TEMPLATE: ${CLERK_JWT_TEMPLATE:-documan}
    image: ${IMAGE_REPO:-theinhumaneme/images}:${WEB_TAG:-documan-angular-21-v1}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  meili-data:
